name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      # src/web/index.html loads dist/web/app.js, so the app has to be built before
      # anything opens the page. The Playwright configs also build via
      # globalSetup; doing it here as well fails fast with a clear step name if
      # the bundle itself is broken.
      - run: npm run build

      # Domain + CLI tests need no browser, so run them before the Chromium
      # download: a broken rule fails the job in seconds instead of minutes.
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - run: npm run screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: docs/screenshots/
          retention-days: 14
